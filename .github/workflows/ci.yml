name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ matrix.go }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install zarr numcodecs numpy
      - run: python internal/gen/gen.py   # fixtures come from the reference implementation
      - run: go vet ./...
      - run: go test -race ./...
